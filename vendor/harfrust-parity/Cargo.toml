[package]
name = "harfrust-fork-parity"
description = "Differential tests: the in-tree HarfRust fork against the crates.io release it was cut from"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[features]
# Build the fork the way upstream would ship it (`aat` and `rand` on) instead of the way
# pmndrs/glyph consumes it (both off).
fork-default-features = ["fork/aat", "fork/rand"]

[dependencies]
# Both sides use the `libm` configuration pmndrs/glyph ships: `no_std`, digest glyph sets.
# The fork keeps `language-tags` on: pmndrs/glyph resolves language tags in the shaper instead
# (`rust/shaper/src/language_tags.rs`, proven equal to this resolution by its own differential test).
upstream = { package = "harfrust", version = "=0.12.0", default-features = false, features = ["libm"] }
fork = { package = "harfrust", path = "../harfrust", default-features = false, features = ["libm", "language-tags"] }
read-fonts = { version = "=0.41.0", default-features = false, features = ["libm"] }
serde_json = "1.0.145"
