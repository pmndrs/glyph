<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Glyph core and renderer lifecycle</title>
  <desc id="desc">An application loads immutable font assets and binds them to a Glyph backend. A render planner lends a borrowed plan to a synchronous renderer target. The target copies or uploads the required data, submits draws, and returns acceptance, which advances the planner revision. GPU execution then continues through the renderer device, pass, and canvas.</desc>
  <defs>
    <marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0 0 10 4 0 8Z" fill="#8c959f" />
    </marker>
    <marker id="gpu-arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4">
      <path d="M0 0 10 4 0 8Z" fill="#3fb950" />
    </marker>
    <style>
      .band { fill: #161b22; stroke: #6e7681; stroke-width: 2; }
      .node { fill: #0d1117; stroke: #8c959f; stroke-width: 2; }
      .core { fill: #0c2d6b; stroke: #58a6ff; }
      .owned { fill: #3b2e00; stroke: #d29922; }
      .render { fill: #0f2d1d; stroke: #3fb950; }
      .edge { fill: none; marker-end: url(#arrow); stroke: #8c959f; stroke-width: 2.5; }
      .gpu { fill: none; marker-end: url(#gpu-arrow); stroke: #3fb950; stroke-width: 3; }
      .return { fill: none; marker-end: url(#arrow); stroke: #a371f7; stroke-dasharray: 8 6; stroke-width: 3; }
      .label { fill: #f0f6fc; font: 700 18px ui-sans-serif, system-ui, sans-serif; }
      .title { fill: #f0f6fc; font: 700 22px ui-sans-serif, system-ui, sans-serif; }
      .minor { fill: #b1bac4; font: 15px ui-sans-serif, system-ui, sans-serif; }
      .call { fill: #58a6ff; font: 600 16px ui-monospace, SFMono-Regular, Consolas, monospace; }
    </style>
  </defs>

  <rect class="band" height="138" rx="14" width="1140" x="30" y="24" />
  <text class="title" x="54" y="56">Application assets</text>
  <rect class="node" height="66" rx="10" width="220" x="84" y="76" />
  <text class="label" x="104" y="103">Font</text>
  <text class="minor" x="104" y="126">loadFont() · immutable</text>
  <rect class="node" height="66" rx="10" width="220" x="388" y="76" />
  <text class="label" x="408" y="103">FontStack</text>
  <text class="minor" x="408" y="126">createFontStack()</text>
  <path class="edge" d="M304 109H388" />

  <rect class="band" height="228" rx="14" width="1140" x="30" y="184" />
  <text class="title" x="54" y="216">Glyph core</text>
  <rect class="node core" height="68" rx="10" width="205" x="68" y="242" />
  <text class="label" x="88" y="270">GlyphEngine</text>
  <text class="minor" x="88" y="294">createGlyphEngine()</text>
  <rect class="node core" height="68" rx="10" width="205" x="338" y="242" />
  <text class="label" x="358" y="270">GlyphBackend</text>
  <text class="minor" x="358" y="294">createBackend()</text>
  <rect class="node core" height="68" rx="10" width="205" x="608" y="242" />
  <text class="label" x="628" y="270">RenderPlanner</text>
  <text class="minor" x="628" y="294">createPlanner()</text>
  <rect class="node core" height="68" rx="10" width="205" x="878" y="242" />
  <text class="label" x="898" y="270">RetainedText</text>
  <text class="minor" x="898" y="294">createText()</text>
  <path class="edge" d="M273 276H338" />
  <path class="edge" d="M543 276H608" />
  <path class="edge" d="M813 276H878" />

  <rect class="node core" height="62" rx="10" width="205" x="338" y="330" />
  <text class="label" x="358" y="357">BackendPolicy</text>
  <text class="minor" x="358" y="379">installPolicy() first</text>
  <path class="edge" d="M440 330V310" />
  <path class="edge" d="M498 142V242" />
  <text class="call" x="510" y="176">bindFontStack()</text>

  <rect class="band" height="134" rx="14" width="1140" x="30" y="434" />
  <text class="title" x="54" y="466">Renderer integration — you implement</text>
  <rect class="node owned" height="70" rx="10" width="330" x="184" y="480" />
  <text class="label" x="204" y="508">PlanTarget.accept()</text>
  <text class="minor" x="204" y="532">synchronously read borrowed plan</text>
  <rect class="node owned" height="70" rx="10" width="330" x="686" y="480" />
  <text class="label" x="706" y="508">Staged renderer transaction</text>
  <text class="minor" x="706" y="532">copy or upload + submit draws</text>
  <path class="edge" d="M514 515H686" />
  <text class="call" x="540" y="472">acquirePayload()</text>
  <path class="edge" d="M710 310C710 386 566 394 390 480" />
  <text class="call" x="520" y="450">publish() → candidate</text>

  <rect class="band" height="140" rx="14" width="1140" x="30" y="590" />
  <text class="title" x="54" y="622">Your renderer</text>
  <rect class="node render" height="68" rx="10" width="250" x="124" y="644" />
  <text class="label" x="144" y="672">Device / context</text>
  <text class="minor" x="144" y="696">physical resource pool</text>
  <rect class="node render" height="68" rx="10" width="250" x="475" y="644" />
  <text class="label" x="495" y="672">Render pass</text>
  <text class="minor" x="495" y="696">submit ordered draws</text>
  <rect class="node render" height="68" rx="10" width="250" x="826" y="644" />
  <text class="label" x="846" y="672">Canvas / texture</text>
  <text class="minor" x="846" y="696">visible destination</text>
  <path class="gpu" d="M851 550C851 598 249 598 249 644" />
  <text class="call" x="438" y="624">accept() returns · GPU continues</text>
  <path class="gpu" d="M374 678H475" />
  <path class="gpu" d="M725 678H826" />
  <path class="return" d="M1016 515C1140 455 1135 360 813 334" />
  <text class="call" x="820" y="448">{ accepted: true }</text>
</svg>
