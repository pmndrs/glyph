name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install canonical toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: pnpm --filter @pmndrs/text-benchmarks exec playwright install --with-deps chromium

      - name: Run deterministic repository checks
        run: pnpm check

      - name: Retain Wasm failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-failure-evidence
          path: |
            packages/font-baker/dist/font_baker.wasm
            packages/text/dist/bitmap_baker.wasm
            packages/text/dist/text_shaper.wasm
          if-no-files-found: error
          retention-days: 7
