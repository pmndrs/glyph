name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Installed-package Labs suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - layout
          - measure
          - glyphs
          - publication
          - batch
          - style
          - reflow
          - stress
          - full

permissions:
  contents: read
  # GitHub models issue/PR comments as pull-request metadata. This permits the
  # size reporter to update its PR comment; it cannot write repository content.
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Install canonical toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository formatting
        run: |
          pnpm exec oxfmt --check \
            .claude/hooks \
            .claude/settings.json \
            .claude/tsconfig.json \
            package.json \
            .agents/docs/log.md

      - name: Check benchmark formatting
        working-directory: benches
        run: pnpm exec oxfmt --check .

      - name: Lint benchmarks
        working-directory: benches
        run: pnpm exec oxlint --deny-warnings .

      - name: Check repository tooling types
        run: pnpm exec tsc -p .claude/tsconfig.json

      - name: Check repository tooling synchronization
        run: node .claude/hooks/sync-agent-config.test.ts

      - name: Check OKF tooling
        run: node --test .agents/skills/open-knowledge-format/scripts/okf-tools.test.mjs

      - name: Check knowledge base
        run: pnpm scripts run docs:check

  size:
    name: Package size report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Install canonical toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: glyph-rust
          key: build-scripts-${{ hashFiles('packages/glyph/scripts/build.mjs', 'packages/glyph/scripts/support/reproducible-rust-env.mjs') }}
          add-job-id-key: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST PMNDRS_GLYPH
          workspaces: |
            packages/glyph/rust/bitmap-baker -> target
            packages/glyph/rust/font-baker -> target
            packages/glyph/rust/mtsdf-admission -> target
            packages/glyph/rust/mtsdf-baker -> target
            packages/glyph/rust/mtsdf-core -> target
            packages/glyph/rust/mtsdf-fontations -> target
            packages/glyph/rust/raster-artifact -> target
            packages/glyph/rust/shaper -> target
            packages/glyph/rust/slug-baker -> target
            packages/glyph/rust/slug-core -> target
            packages/glyph/rust/slug-fontations -> target
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage package-size presentation
        run: |
          cp benches/src/benchmark/package-size-summary.ts "$RUNNER_TEMP/package-size-summary.ts"
          cp benches/src/benchmark/production-app-size.ts "$RUNNER_TEMP/production-app-size.ts"
          cp benches/src/benchmark/framework-adapter-size.ts "$RUNNER_TEMP/framework-adapter-size.ts"
          cp benches/src/benchmark/vite-size-bundle.ts "$RUNNER_TEMP/vite-size-bundle.ts"
          cp benches/size-entries/react-runtime.ts "$RUNNER_TEMP/react-runtime.ts"
          cp benches/src/benchmark/size-limit-report.mts "$RUNNER_TEMP/size-limit-report.mts"
          cp benches/src/benchmark/package-size-comment.mts "$RUNNER_TEMP/package-size-comment.mts"

      - name: Compare package delivery sizes with the PR base
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        env:
          SIZE_REPORT_TRACE_PATH: ${{ runner.temp }}/glyph-size-limit-results.jsonl
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: build
          skip_step: install
          package_manager: pnpm
          # The action checks out both revisions, so stage the head revision's
          # presentation adapter outside the worktree before it switches bases.
          script: >-
            sh -c "node benches/scripts/measure-package-sizes.mts |
            node \"$RUNNER_TEMP/size-limit-report.mts\""

      - name: Publish compact package-size report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIZE_REPORT_TRACE_PATH: ${{ runner.temp }}/glyph-size-limit-results.jsonl
          SIZE_REPORT_PR: ${{ github.event.pull_request.number }}
          SIZE_REPORT_REPOSITORY: ${{ github.repository }}
        run: node "$RUNNER_TEMP/package-size-comment.mts"

  check:
    name: Check
    needs: static
    runs-on: ubuntu-24.04
    # The runtime suite alone runs ~15 minutes; 20 left no headroom once the
    # decoration conformance cases landed and the job died at the wall.
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Install canonical toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: glyph-rust
          key: build-scripts-${{ hashFiles('packages/glyph/scripts/build.mjs', 'packages/glyph/scripts/support/reproducible-rust-env.mjs') }}
          add-job-id-key: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST PMNDRS_GLYPH
          workspaces: |
            packages/glyph/rust/bitmap-baker -> target
            packages/glyph/rust/font-baker -> target
            packages/glyph/rust/mtsdf-admission -> target
            packages/glyph/rust/mtsdf-baker -> target
            packages/glyph/rust/mtsdf-core -> target
            packages/glyph/rust/mtsdf-fontations -> target
            packages/glyph/rust/raster-artifact -> target
            packages/glyph/rust/shaper -> target
            packages/glyph/rust/slug-baker -> target
            packages/glyph/rust/slug-core -> target
            packages/glyph/rust/slug-fontations -> target
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision authenticated vendored HarfBuzz utilities
        run: |
          pnpm scripts run fixture:harfbuzz:provision
          pnpm scripts run fixture:harfbuzz:provision -- --version=14.2.0
          printf '%s\n' "$GITHUB_WORKSPACE/benches/.cache/harfbuzz/14.2.0/build/util" >> "$GITHUB_PATH"

      - name: Select rolling runner Chromium
        shell: bash
        run: |
          chromium_executable=''
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chromium_executable="$(command -v "$candidate")"
              break
            fi
          done
          if [[ -z "$chromium_executable" ]]; then
            echo 'No system Chromium executable is available on this runner.' >&2
            exit 1
          fi
          "$chromium_executable" --version
          printf 'PMNDRS_GLYPH_CHROMIUM_EXECUTABLE_PATH=%s\n' "$chromium_executable" >> "$GITHUB_ENV"

      - name: Check core package
        run: pnpm --filter @pmndrs/glyph check

      - name: Pack candidate package for performance reporting
        run: |
          mkdir -p benches/.cache/labs-candidate
          pnpm --dir packages/glyph pack --pack-destination ../../benches/.cache/labs-candidate

      - name: Retain candidate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glyph-candidate-package
          path: benches/.cache/labs-candidate/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Check glyph example package
        run: pnpm --filter @pmndrs/glyph-example-raster check

      - name: Check example renderer package
        run: pnpm --filter @pmndrs/glyph-example-renderer check

      - name: Check benchmark application types
        working-directory: benches
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Check benchmark script types
        working-directory: benches
        run: pnpm exec tsc -p tsconfig.scripts.json --noEmit

      - name: Prove stable Three raster rendering
        run: pnpm scripts run benchmark:v1-bitmap

      - name: Prove TypeGPU Three raster rendering
        run: pnpm scripts run benchmark:v1-bitmap -- --typegpu

      - name: Check paragraph fixture references
        run: pnpm scripts run fixture:paragraph-contracts:check

      - name: Check bidi contract
        run: pnpm scripts run fixture:paragraph-bidi:check

      - name: Check CJK contract
        run: pnpm scripts run fixture:paragraph-cjk:check

      - name: Run benchmark unit tests
        run: pnpm scripts run benchmark:unit

      - name: Check workflow registry
        run: pnpm scripts run benchmark:workflow-check

      - name: Run browser conformance suite
        run: |
          mkdir -p benches/.cache
          pnpm scripts run benchmark:conformance -- \
            --suite conformance \
            --dpr 1 \
            --samples 3 \
            --warmup 1 \
            --output .cache/ci-conformance.json

      - name: Retain browser conformance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-conformance-results
          path: benches/.cache/ci-conformance.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify packed consumer
        run: pnpm scripts run benchmark:packed-consumer

      - name: Build benchmark application
        run: pnpm --dir benches build -- --runtime-packages-ready

      - name: Check Three and React Three Fiber examples
        run: pnpm --filter @pmndrs/glyph-examples check

      - name: Check Japanese showcase fixture
        run: pnpm scripts run fixture:japanese-showcase:check

      - name: Retain Wasm failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-failure-evidence
          path: |
            packages/glyph/dist/font-baker.wasm
            packages/glyph/dist/bitmap-baker.wasm
            packages/glyph/dist/mtsdf-baker.wasm
            packages/glyph/dist/slug-baker.wasm
            packages/glyph/dist/text-shaper.wasm
          if-no-files-found: error
          retention-days: 7

  performance:
    name: Package performance report
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Install canonical toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download candidate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: glyph-candidate-package
          path: benches/.cache/labs-candidate

      - name: Select package performance suite
        id: suite
        run: node benches/scripts/select-package-labs-suite.mts

      - name: Compare installed-package performance
        run: >-
          pnpm scripts run benchmark:labs-package --
          --baseline @pmndrs/glyph@canary
          --candidate .cache/labs-candidate
          --suite ${{ steps.suite.outputs.suite }}
          --output .cache/labs-package

      - name: Retain Labs performance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glyph-package-performance
          path: benches/.cache/labs-package
          if-no-files-found: warn
          retention-days: 14
