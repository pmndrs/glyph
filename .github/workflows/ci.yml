name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # GitHub models issue/PR comments as pull-request metadata. This permits the
  # size reporter to update its PR comment; it cannot write repository content.
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install canonical toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Keep these as independent steps with `always()` so one formatting or
      # lint failure does not hide another package's diagnostics.
      - name: Check repository formatting
        run: pnpm exec oxfmt --check .claude/hooks .claude/settings.json .claude/tsconfig.json package.json docs/log.md

      - name: Check core package formatting
        if: always()
        working-directory: packages/text
        run: pnpm exec oxfmt --check .

      - name: Check glyph example formatting
        if: always()
        working-directory: packages/glyph-example-raster
        run: pnpm exec oxfmt --check package.json src tests tsconfig.json tsconfig.build.json

      - name: Check benchmark application formatting
        if: always()
        working-directory: apps/benchmarks
        run: pnpm exec oxfmt --check .

      - name: Check React Three Fiber example formatting
        if: always()
        working-directory: apps/r3f-hello-world
        run: pnpm exec oxfmt --check .

      - name: Lint core package
        if: always()
        run: pnpm --filter @pmndrs/text exec oxlint --deny-warnings .

      - name: Lint glyph example package
        if: always()
        run: pnpm --filter @pmndrs/text-glyph-example-raster exec oxlint --deny-warnings .

      - name: Lint benchmark application
        if: always()
        run: pnpm --filter @pmndrs/text-benchmarks exec oxlint --deny-warnings .

      - name: Lint React Three Fiber example
        if: always()
        run: pnpm --filter @pmndrs/text-r3f-hello-world exec oxlint --deny-warnings .

      - name: Check repository tooling
        if: always()
        run: |
          tsc -p .claude/tsconfig.json
          node --test .claude/hooks/sync-agent-config.test.ts

      - name: Validate knowledge base
        if: always()
        run: ruby .agents/skills/open-knowledge-format/scripts/validate_okf.rb docs --workspace-root .

  size:
    name: Package size report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install canonical toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage package-size presentation
        run: |
          cp apps/benchmarks/src/benchmark/package-size-summary.ts "$RUNNER_TEMP/package-size-summary.ts"
          cp apps/benchmarks/src/benchmark/size-limit-report.mts "$RUNNER_TEMP/size-limit-report.mts"

      - name: Compare package delivery sizes with the PR base
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: build
          skip_step: install
          package_manager: pnpm
          # The action checks out both revisions, so stage the head revision's
          # presentation adapter outside the worktree before it switches bases.
          script: >-
            sh -c "node apps/benchmarks/scripts/measure-package-sizes.mts |
            node \"$RUNNER_TEMP/size-limit-report.mts\""

  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install canonical toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install HarfBuzz workload toolchain
        run: mise -C apps/benchmarks install

      - name: Install HarfBuzz native prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglib2.0-dev
          pkg-config --modversion glib-2.0

      - name: Provision authenticated HarfBuzz utilities
        run: |
          pnpm scripts run fixture:harfbuzz:provision
          mise -C apps/benchmarks exec -- node ./scripts/provision-harfbuzz.mts --version=14.2.0
          printf '%s\n' "$GITHUB_WORKSPACE/apps/benchmarks/.cache/harfbuzz/14.2.0/build/util" >> "$GITHUB_PATH"

      - name: Select rolling runner Chromium
        shell: bash
        run: |
          chromium_executable=''
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chromium_executable="$(command -v "$candidate")"
              break
            fi
          done
          if [[ -z "$chromium_executable" ]]; then
            echo 'No system Chromium executable is available on this runner.' >&2
            exit 1
          fi
          "$chromium_executable" --version
          printf 'PMNDRS_TEXT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$chromium_executable" >> "$GITHUB_ENV"

      # Run package and fixture gates independently. A failure remains visible
      # in the job conclusion, while `always()` lets later suites report too.
      - name: Check core package
        run: pnpm --filter @pmndrs/text check

      - name: Check glyph example package
        if: always()
        run: pnpm --filter @pmndrs/text-glyph-example-raster check

      - name: Build benchmark runtime dependency
        if: always()
        run: pnpm --filter @pmndrs/text build

      - name: Type-check benchmark application
        if: always()
        working-directory: apps/benchmarks
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Type-check benchmark scripts
        if: always()
        working-directory: apps/benchmarks
        run: pnpm exec tsc -p tsconfig.scripts.json --noEmit

      - name: Check benchmark package-size contract
        if: always()
        working-directory: apps/benchmarks
        run: node scripts/measure-package-sizes.mts --check

      - name: Check benchmark paragraph fixture references
        if: always()
        working-directory: apps/benchmarks
        run: node scripts/check-paragraph-contract-fixtures.mts

      - name: Check benchmark bidi contract
        if: always()
        working-directory: apps/benchmarks
        run: node scripts/generate-paragraph-bidi-contract.mts --check

      - name: Check benchmark CJK contract
        if: always()
        working-directory: apps/benchmarks
        run: node scripts/generate-paragraph-cjk-contract.mts --check

      - name: Run benchmark unit tests
        if: always()
        working-directory: apps/benchmarks
        run: pnpm exec vitest run

      - name: Check benchmark workflow registry
        if: always()
        working-directory: apps/benchmarks
        run: node --test scripts/workflows.test.mts

      - name: Run benchmark browser conformance
        if: always()
        working-directory: apps/benchmarks
        run: node scripts/run-headless.mts --suite conformance --dpr 1 --samples 3 --warmup 1 --port 5181

      - name: Run benchmark packed-consumer contract
        if: always()
        working-directory: apps/benchmarks
        run: node scripts/run-packed-consumer.mts

      - name: Build benchmark application
        if: always()
        working-directory: apps/benchmarks
        run: node scripts/build.mts

      - name: Check React Three Fiber example
        if: always()
        run: pnpm --filter @pmndrs/text-r3f-hello-world check

      - name: Check Japanese showcase fixture
        if: always()
        run: pnpm scripts run fixture:japanese-showcase:check

      - name: Retain Wasm failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-failure-evidence
          path: |
            packages/text/dist/font_baker.wasm
            packages/text/dist/bitmap_baker.wasm
            packages/text/dist/mtsdf_baker.wasm
            packages/text/dist/slug_baker.wasm
            packages/text/dist/text_shaper.wasm
          if-no-files-found: error
          retention-days: 7
