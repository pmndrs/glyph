name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Install canonical toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test package
        run: pnpm --filter @pmndrs/glyph check

      - name: Select release version and npm tag
        id: version
        working-directory: packages/glyph
        shell: bash
        run: |
          base_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [[ "${GITHUB_REF_NAME}" != "v${base_version}" ]]; then
              echo 'Stable release tags must match the package version exactly (vMAJOR.MINOR.PATCH).' >&2
              exit 1
            fi
            release_version="${base_version}"
            npm_tag='latest'
          else
            release_date="$(date -u +%Y%m%d)"
            release_version="${base_version%%-*}-canary-${GITHUB_SHA::8}-${release_date}"
            pnpm version "${release_version}" --no-git-tag-version
            npm_tag='canary'
          fi
          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${npm_tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish package
        working-directory: packages/glyph
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.tag }}
        run: pnpm publish --tag "${NPM_DIST_TAG}" --access public --no-git-checks

      - name: Add release summary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          NPM_DIST_TAG: ${{ steps.version.outputs.tag }}
        run: echo "Published @pmndrs/glyph@${RELEASE_VERSION} with the ${NPM_DIST_TAG} tag." >> "${GITHUB_STEP_SUMMARY}"
