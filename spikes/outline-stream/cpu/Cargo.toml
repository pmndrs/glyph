[package]
name = "outline-stream-cpu"
description = "Temporary spike: scalar triplet decoder plus GPU point-layout emitter, adapted from research/encoding/decoder"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

# Standalone: not a member of any repository workspace.
[workspace]
