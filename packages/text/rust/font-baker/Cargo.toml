[package]
name = "pmndrs-text-font-baker"
description = "Portable shaping-data baker for pmndrs/text"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/pmndrs/text"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate-abi"
path = "src/bin/generate-abi.rs"
required-features = ["std"]

[[bin]]
name = "generate-shaping-oracle"
path = "src/bin/generate-shaping-oracle.rs"
required-features = ["oracle"]

[[bin]]
name = "inspect-font-fixture"
path = "src/bin/inspect-font-fixture.rs"
required-features = ["oracle"]

[[bin]]
name = "fuzz-bake"
path = "src/bin/fuzz-bake.rs"
required-features = ["fuzzing"]

[features]
default = ["compression"]
std = ["read-fonts/std", "serde/std", "serde_json/std", "skrifa/std"]
subsetting = ["std", "dep:skera"]
compression = ["std", "dep:brotli", "dep:flate2"]
fuzzing = ["std"]
oracle = ["std", "dep:harfrust"]

[dependencies]
brotli = { version = "8.0.4", optional = true }
core_maths = "0.1.1"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"], optional = true }
harfrust = { version = "0.12.0", default-features = false, features = ["libm"], optional = true }
read-fonts = { version = "0.42.1", default-features = false, features = ["libm"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", default-features = false }
skera = { version = "=0.5.1", default-features = false, optional = true }
skrifa = { version = "0.45.1", default-features = false, features = ["libm"] }
thiserror = { version = "2.0.19", default-features = false }

[build-dependencies]
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = "=5.0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
