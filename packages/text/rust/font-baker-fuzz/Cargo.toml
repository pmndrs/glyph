[package]
name = "pmndrs-text-font-baker-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
pmndrs-text-font-baker = { path = "../font-baker", default-features = false, features = ["std"] }
pmndrs-text-mtsdf-admission = { path = "../mtsdf-admission", features = ["fuzzing"] }

[[bin]]
name = "bake_font"
path = "fuzz_targets/bake_font.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mtsdf_outline"
path = "fuzz_targets/mtsdf_outline.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
