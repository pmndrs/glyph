[package]
name = "pmndrs-text-slug-core"
description = "Repository-owned no_std Slug curve and band generator for pmndrs/text"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/pmndrs/text"
publish = false

[features]
default = ["std"]
std = []
# Non-shipping reference-grid format used only by the Slug autoresearch
# challenger. Keeping it in the core crate lets the baker serialize the
# experimental layout without changing the production V0 path.
autoresearch-hull-bands = []

[dependencies]
core_maths = "0.1.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
