[package]
name = "pmndrs-glyph-raster-artifact"
description = "Shared lossless raster artifact primitives for pmndrs/glyph bakers"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/pmndrs/glyph"
publish = false

[features]
default = ["std"]
std = ["dep:ktx2", "ktx2/std", "serde_json/std"]

[dependencies]
ktx2 = { version = "0.5.0", default-features = false, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }

[build-dependencies]
ktx2 = { version = "0.5.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
