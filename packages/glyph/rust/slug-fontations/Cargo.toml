[package]
name = "pmndrs-glyph-slug-fontations"
description = "Fontations outline adapter for the pmndrs/glyph Slug generator"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/pmndrs/glyph"
publish = false

[features]
default = ["std"]
std = ["pmndrs-glyph-slug-core/std", "skrifa/std"]

[dependencies]
pmndrs-glyph-slug-core = { path = "../slug-core", default-features = false }
skrifa = { version = "=0.45.1", default-features = false, features = ["libm"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
