[package]
name = "pmndrs-glyph-bitmap-baker"
description = "Portable bitmap-strike baker for pmndrs/glyph"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/pmndrs/glyph"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate-bitmap-abi"
path = "src/bin/generate-bitmap-abi.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["pmndrs-glyph-raster-artifact/std", "read-fonts/std", "serde/std", "serde_json/std", "skrifa/std", "zeno/std"]

[dependencies]
core_maths = "0.1.1"
pmndrs-glyph-raster-artifact = { path = "../raster-artifact", default-features = false }
read-fonts = { version = "0.42.1", default-features = false, features = ["libm"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", default-features = false }
skrifa = { version = "0.45.1", default-features = false, features = ["libm"] }
thiserror = { version = "2.0.19", default-features = false }
zeno = { version = "0.3.3", default-features = false, features = ["eval", "libm"] }

[build-dependencies]
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = "=5.0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
