[package]
name = "pmndrs-glyph-shaper"
description = "HarfRust Wasm runtime shaper for pmndrs/glyph"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/pmndrs/glyph"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate-shaper-abi"
path = "src/bin/generate-shaper-abi.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["serde_json/std"]
kernel-lab = []
simd128 = []

[dependencies]
harfrust = { version = "0.12.0", default-features = false, features = ["libm"] }
read-fonts = { version = "0.41.0", default-features = false, features = ["libm"] }
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }
unicode-bidi = { version = "0.3.18", default-features = false }
unicode-segmentation = { version = "=1.13.3", default-features = false, features = ["no_std"] }

[build-dependencies]
serde_json = "1.0.145"

[dev-dependencies]
flate2 = "1.1.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = "=5.0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
