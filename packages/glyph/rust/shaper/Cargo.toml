[package]
name = "pmndrs-glyph-shaper"
description = "HarfRust Wasm runtime shaper for pmndrs/glyph"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/pmndrs/glyph"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate-shaper-abi"
path = "src/bin/generate-shaper-abi.rs"
required-features = ["std"]

[[bin]]
name = "layout-oracle"
path = "src/bin/layout-oracle.rs"
required-features = ["std", "oracle"]

[[test]]
name = "layout_oracle"
path = "tests/layout_oracle.rs"
required-features = ["std", "oracle"]

[[test]]
name = "incremental_equals_cold"
path = "tests/incremental_equals_cold.rs"
required-features = ["std", "oracle"]

[[test]]
name = "editing_offsets"
path = "tests/editing_offsets.rs"
required-features = ["std", "oracle"]

[features]
default = ["std"]
std = ["serde_json/std"]
kernel-lab = []
simd128 = []
debug-validation = []
diagnostic-live-memory = []
# The layout correctness oracle: lane capture, fixture matrix and the seeded differential
# driver. Off in every shipped artifact.
oracle = []
# Stage clocks for the oracle probe (`scripts/stage-bench.mjs`). Off in every shipped artifact.
stage-bench = ["oracle"]

[dependencies]
harfrust = { version = "0.12.0", default-features = false, features = ["libm"] }
read-fonts = { version = "0.41.0", default-features = false, features = ["libm"] }
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }
unicode-bidi = { version = "0.3.18", default-features = false }
unicode-segmentation = { version = "=1.13.3", default-features = false, features = ["no_std"] }
pmndrs-glyph-slug-core = { path = "../slug-core", default-features = false }

[build-dependencies]
serde_json = "1.0.145"

[dev-dependencies]
flate2 = "1.1.9"
skrifa = { version = "=0.44.0", default-features = false, features = ["libm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = "=5.0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# HarfRust is forked in-tree (vendor/harfrust, see GLYPH-FORK.md there). The fork adds default-on
# `aat` and `rand` cargo features; the dependency above leaves both off.
[patch.crates-io]
harfrust = { path = "../../../../vendor/harfrust" }
