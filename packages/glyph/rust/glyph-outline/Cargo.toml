[package]
name = "pmndrs-glyph-outline"
description = "Glyph-outline decoder for pmndrs/glyph outline SFNTs"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/pmndrs/glyph"
publish = false

[dependencies]
read-fonts = { version = "0.42.1", default-features = false, features = ["libm"] }
pmndrs-glyph-slug-core = { path = "../slug-core", default-features = false }

[dev-dependencies]
read-fonts = { version = "0.42.1", default-features = false, features = ["libm", "std"] }
skrifa = { version = "0.45.1", default-features = false, features = ["libm", "std"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
